<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محادثة تفاعلية متقدمة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body {
  font-family: 'Cairo', sans-serif;
  margin:0; padding:0;
  background: linear-gradient(135deg, #ffe0f0, #fad0c4);
  overflow-x: hidden; text-align: center; min-height: 100vh; position: relative;
}
h1 { font-size: 2em; margin: 15px 0; }
input { padding: 10px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; width: 70%; max-width: 300px; }
button { padding: 12px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; background-color: #ff6f91; color: white; font-size: 1em; transition:0.3s; }
button:hover { background-color: #ff3f69; transform: scale(1.05); }
#chat, #final { display: none; margin-top: 20px; max-width: 400px; margin-left:auto; margin-right:auto; }
.bubble { display:block; padding:12px 18px; margin:8px 0; border-radius:20px; background:linear-gradient(120deg,#ffe0e6,#ffb3c6); box-shadow:0 4px 6px rgba(0,0,0,0.1); text-align:left; word-wrap: break-word; opacity:0; position: relative; transform:translateY(100px); transition:all 0.5s ease; }
.bubble.show { opacity:1; transform:translateY(0);}
.heart { position:absolute; font-size:20px; animation: floatHeart 4s linear infinite; }
@keyframes floatHeart {0%{transform:translateY(0) scale(1);opacity:1;}50%{transform:translateY(-120px) scale(1.3);opacity:0.7;}100%{transform:translateY(-250px) scale(1);opacity:0;} }
.star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation: moveStar linear infinite; }
@keyframes moveStar {0%{transform:translateY(0);}100%{transform:translateY(-100vh);}}
.bubble-option { display:inline-block; margin-top:5px; padding:8px 16px; background:#ffb6c1; border-radius:20px; cursor:pointer; transition:0.3s; }
.bubble-option:hover{ background:#ff77aa; transform:scale(1.05); }
</style>
</head>
<body>

<h1>أهلاً وسهلاً!</h1>
<img src="https://i.postimg.cc/Y0qRkCzP/girl-avatar.png" alt="avatar" class="avatar" style="width:80px;border-radius:50%;margin-bottom:10px;">
<br>
<label>اكتبي اسمك:</label>
<br>
<input type="text" id="nameInput" placeholder="فلانة">
<br>
<button onclick="startChat()">ابدئي</button>

<div id="chat"></div>
<div id="final"></div>

<audio id="song" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>

<script>
let chatDiv=document.getElementById('chat');
let finalDiv=document.getElementById('final');
let userName=''; let step=0;

function startChat(){
  userName=document.getElementById('nameInput').value||'فلانة';
  document.querySelector('h1').style.display='none';
  document.getElementById('nameInput').style.display='none';
  document.querySelector('button').style.display='none';
  document.querySelector('.avatar').style.display='none';
  chatDiv.style.display='block';
  createStars(50);
  showStep();
}

function showStep(){
  chatDiv.innerHTML=''; finalDiv.innerHTML='';
  switch(step){
    case 0: createBubble('اكلج'); createOption('كول عيناي', ()=>{ step++; showStep(); }); break;
    case 1: createBubble('فلانة عندي سؤال الججج'); createOption('شنو هو', ()=>{ step++; showStep(); }); break;
    case 2: createBubble('تحبين فلان؟؟؟'); createOption('ها!؟', ()=>{ step++; showStep(); }); break;
    case 3: createBubble('شنو ها؟؟ جاوبي لج'); createOption('مدري😔', ()=>{ step++; showStep(); }); break;
    case 4: createBubble('اذا تحبين فلان دوسي على هذا القلب 💗'); createOption('💗', ()=>{ step++; showStep(); }); break;
    case 5: createBubble('احبج ❤️'); createOption('اعشقك واحبك اني هم', ()=>{
      step++; showStep(); createHearts(40);
    }); break;
    case 6:
      chatDiv.style.display='none';
      finalDiv.innerHTML='<h2>🎵 استمعي للأغنية! 🎵</h2>';
      playSong();
      createHearts(30);
      break;
  }
}

function createBubble(text){
  let b=document.createElement('div'); b.className='bubble'; chatDiv.appendChild(b);
  typeEffect(b,text,()=>{b.classList.add('show');});
}

function createOption(text,callback){
  let btn=document.createElement('div'); btn.className='bubble-option'; btn.innerText=text; btn.onclick=callback; chatDiv.appendChild(btn);
}

function typeEffect(element,text,callback){
  let i=0; let interval=setInterval(()=>{
    element.innerText+=text[i]; i++;
    if(i>=text.length){ clearInterval(interval); callback(); }
  },40);
}

function createHearts(count){
  for(let i=0;i<count;i++){
    let heart=document.createElement('div'); heart.className='heart'; heart.innerText='💗';
    heart.style.left=Math.random()*window.innerWidth+'px'; heart.style.top=Math.random()*window.innerHeight+'px';
    heart.style.fontSize=(12+Math.random()*25)+'px'; heart.style.animationDuration=(2+Math.random()*3)+'s';
    document.body.appendChild(heart); setTimeout(()=>heart.remove(),5000);
  }
}

function createStars(count){
  for(let i=0;i<count;i++){
    let star=document.createElement('div'); star.className='star';
    star.style.left=Math.random()*window.innerWidth+'px'; star.style.top=Math.random()*window.innerHeight+'px';
    star.style.width=star.style.height=(1+Math.random()*3)+'px';
    star.style.animationDuration=(5+Math.random()*5)+'s';
    document.body.appendChild(star);
  }
}

function playSong(){
  let song=document.getElementById('song'); song.play();
}
</script>

</body>
</html>
